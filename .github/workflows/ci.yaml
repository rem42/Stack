name: Continuous Integration

on:
    push:
        branches:
            - main
        paths-ignore:
            - "docs/**"
            - "*.md"
    pull_request:
        paths-ignore:
            - "docs/**"
            - "*.md"
    workflow_dispatch: ~
    workflow_call: ~

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static-analysis:
        name: "Static Analysis & Quality"
        runs-on: ubuntu-latest
        env:
            APP_ENV: test
            COMPOSER_ROOT_VERSION: "dev-main"
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7

            - name: "Setup PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  tools: "symfony, composer:v2"
                  coverage: none

            - name: "Get Composer cache directory"
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: "Setup Composer cache"
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php8.4-static-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php8.4-static-

            - name: "Install dependencies"
              run: composer update --no-interaction --no-scripts --prefer-dist --no-progress

            - name: "Validate composer.json"
              run: composer validate --strict --no-check-version

            - name: "Check for security vulnerabilities"
              run: symfony security:check

            - name: "Validate coding standard"
              run: vendor/bin/ecs check

            - name: "Validate package versions"
              run: vendor/bin/monorepo-builder validate

            - name: "Run PHPStan"
              run: vendor/bin/phpstan analyse

    app-tests:
        name: "App Tests (PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.2", "8.3"]
                postgres: ["16"]
                symfony: ["^6.4", "^7.4"]
                include:
                    - php: "8.4"
                      postgres: "16"
                      symfony: "^8.1"
        env:
            APP_ENV: test
            COMPOSER_ROOT_VERSION: "dev-main"
            DATABASE_URL: "pgsql://postgres:postgres@127.0.0.1/sylius_stack?charset=utf8&serverVersion=${{ matrix.postgres }}"
        services:
            postgres:
                image: postgres:${{ matrix.postgres }}
                env:
                    POSTGRES_DB: sylius_stack
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7

            - name: "Setup PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ matrix.php }}"
                  extensions: pdo_pgsql, intl
                  tools: "symfony, composer:v2, flex"
                  coverage: none

            - name: "Shutdown default MySQL"
              run: sudo service mysql stop

            - name: "Restrict packages' versions"
              run: composer config extra.symfony.require "${{ matrix.symfony }}"

            - name: "Get Composer cache directory"
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: "Setup Composer cache"
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php${{ matrix.php }}-symfony-${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php${{ matrix.php }}-symfony-${{ matrix.symfony }}-
                      ${{ runner.os }}-php${{ matrix.php }}-

            - name: "Install dependencies"
              run: composer update --no-interaction --no-scripts --prefer-dist --no-progress

            - name: "Validate Container"
              run: bin/console lint:container

            - name: "Create testing database"
              run: |
                  bin/console doctrine:database:create
                  bin/console doctrine:schema:create

            - name: "Install & compile assets"
              run: |
                  bin/console importmap:install
                  bin/console tailwind:build
                  bin/console asset-map:compile

            - name: "Run PHPUnit"
              run: vendor/bin/phpunit

            - name: "Run Translations Test Suite"
              env:
                  APP_LOCALE: fr
              run: vendor/bin/phpunit --testsuite="TranslationsTestSuite"

    packages-tests:
        name: "${{ matrix.package }} (PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package:
                    - AdminUi
                    - BootstrapAdminUi
                    - ShadcnAdminUi
                    - TwigHooks
                    - TwigExtra
                    - UiTranslations
                php: ["8.2", "8.3"]
                symfony: ["^6.4", "^7.4"]
                include:
                    - package: AdminUi
                      php: "8.4"
                      symfony: "^8.1"
                    - package: BootstrapAdminUi
                      php: "8.4"
                      symfony: "^8.1"
                    - package: ShadcnAdminUi
                      php: "8.4"
                      symfony: "^8.1"
                    - package: TwigHooks
                      php: "8.4"
                      symfony: "^8.1"
                    - package: TwigExtra
                      php: "8.4"
                      symfony: "^8.1"
                    - package: UiTranslations
                      php: "8.4"
                      symfony: "^8.1"
        env:
            APP_ENV: test
            COMPOSER_ROOT_VERSION: "dev-main"
        defaults:
            run:
                working-directory: src/${{ matrix.package }}
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7

            - name: "Setup PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ matrix.php }}"
                  tools: "composer:v2, flex"
                  coverage: none

            - name: "Get Composer cache directory"
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: "Setup Composer cache"
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-pkg-${{ matrix.package }}-php${{ matrix.php }}-symfony-${{ matrix.symfony }}-${{ hashFiles(format('src/{0}/composer.json', matrix.package)) }}
                  restore-keys: |
                      ${{ runner.os }}-pkg-${{ matrix.package }}-php${{ matrix.php }}-
                      ${{ runner.os }}-php${{ matrix.php }}-

            - name: "Configure Composer & Symfony constraints"
              run: |
                  composer config --no-plugins allow-plugins.symfony/runtime true
                  composer config extra.symfony.require "${{ matrix.symfony }}"

            - name: "Install dependencies"
              run: composer update --no-interaction --no-scripts --prefer-dist --no-progress

            - name: "Build assets (ShadcnAdminUi)"
              if: matrix.package == 'ShadcnAdminUi'
              run: |
                  php tests/Functional/.application/bin/console importmap:install
                  php tests/Functional/.application/bin/console tailwind:build

            - name: "Run PHPUnit"
              run: vendor/bin/phpunit

    js-tests:
        name: "JS Tests (${{ matrix.package }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package:
                    - BootstrapAdminUi
                    - ShadcnAdminUi
        defaults:
            run:
                working-directory: src/${{ matrix.package }}
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7

            - name: "Setup Node.js"
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "yarn"
                  cache-dependency-path: src/${{ matrix.package }}/yarn.lock

            - name: "Install dependencies & run tests"
              run: |
                  yarn install --frozen-lockfile --non-interactive
                  yarn test
